net {
  type = mainnet
}

storage {
  db.version = 2
  db.sync = false
  db.directory = "database"
  index.directory = "index"
  transHistory.switch = "on"
}

node.discovery = {
  enable = true
  persist = true
}

# placeholder replaced by replay-poc.sh
node.shutdown = {
  BlockCount = REPLAY_BLOCK_COUNT
}

node {
  listen.port = 18888

  connection.timeout = 2
  tcpNettyWorkThreadNum = 0
  udpNettyWorkThreadNum = 1

  maxActiveNodes = 30
  maxActiveNodesWithSameIp = 2
  minParticipationRate = 15

  p2p {
    version = 11111
  }

  rpc {
    port = 50051
    minEffectiveConnection = 1
  }

  http {
    fullNodePort = 8090
  }
}

